[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[project]
name = "PyBLNET"
version = "0.12.0"
description = "Automate wireless communication to UVR1611 via BL-NET"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "nielstron", email = "n.muendler@posteo.de"},
    {name = "Alexander Eisele", email = "alexander@eiselecloud.de"},
]
keywords = ["python", "uvr1611", "blnet", "technische alternative", "home automation", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Object Brokering",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
dependencies = [
    "requests",
]

[project.urls]
"Homepage" = "https://github.com/dereisele/pyblnet/"
"Upstream" = "https://github.com/nielstron/pyblnet/"

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "ruff",
]

[tool.uv.build-backend]
module-name = "pyblnet"
module-root = ""

[tool.ruff.lint]
extend-select = ["UP"]
